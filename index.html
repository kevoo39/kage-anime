<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KAGE — Anime Discovery</title>
<style>
:root{--bg:#0b0b0d;--panel:#151518;--muted:#a5a5ad;--text:#f7f7f8;--accent:#f47521;--line:#28282d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,system-ui,sans-serif}
button,input,select{font:inherit}button{cursor:pointer;border:0}.nav{position:sticky;top:0;z-index:20;background:rgba(11,11,13,.92);backdrop-filter:blur(16px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:24px;padding:14px 5vw}
.logo{font-weight:900;font-size:25px;letter-spacing:-1px;color:var(--accent)}.links{display:flex;gap:18px;color:#ddd}.links button{background:none;color:inherit}
.search{margin-left:auto;display:flex;background:#202025;border-radius:9px;overflow:hidden}.search input{width:min(28vw,300px);background:none;border:0;outline:0;color:#fff;padding:10px 12px}.search button{background:var(--accent);padding:0 14px}
main{max-width:1400px;margin:auto}.hero{min-height:500px;padding:72px 5vw 55px;display:flex;align-items:end;position:relative;overflow:hidden;background-size:cover;background-position:center}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0b0b0d 0%,rgba(11,11,13,.88) 34%,rgba(11,11,13,.2) 72%),linear-gradient(0deg,#0b0b0d,transparent 45%)}.hero>*{position:relative;z-index:1}.hero-copy{max-width:620px}.eyebrow{color:var(--accent);font-weight:800;text-transform:uppercase;letter-spacing:2px}.hero h1{font-size:clamp(38px,6vw,72px);line-height:.98;margin:10px 0}.hero p{color:#d2d2d6;max-width:580px}.actions{display:flex;gap:10px}.primary,.secondary{padding:11px 18px;border-radius:7px;font-weight:800}.primary{background:var(--accent);color:#111}.secondary{background:#2a2a2f;color:#fff}
section{padding:26px 5vw}.section-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.section-head h2{margin:0;font-size:23px}.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(155px,1fr);gap:14px;overflow-x:auto;padding-bottom:12px}.rail::-webkit-scrollbar{height:6px}.rail::-webkit-scrollbar-thumb{background:#333;border-radius:10px}.card{min-width:0;background:var(--panel);border-radius:8px;overflow:hidden;transition:.2s;position:relative}.card:hover{transform:translateY(-4px);box-shadow:0 10px 30px #0008}.poster{aspect-ratio:2/3;background:#222;position:relative}.poster img{width:100%;height:100%;object-fit:cover;display:block}.badge{position:absolute;top:8px;left:8px;background:#000c;padding:4px 7px;border-radius:5px;font-size:11px;font-weight:800}.card-body{padding:10px}.title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{color:var(--muted);font-size:12px;margin-top:3px}.score{color:#ffd36a}.empty{padding:35px;color:var(--muted)}.filters{display:flex;gap:8px;flex-wrap:wrap}.filters select{background:#1c1c20;color:#fff;border:1px solid var(--line);padding:9px;border-radius:7px}
.modal{position:fixed;inset:0;background:#000b;z-index:50;display:none;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.dialog{width:min(900px,100%);max-height:90vh;overflow:auto;background:#151518;border:1px solid var(--line);border-radius:12px}.detail{display:grid;grid-template-columns:220px 1fr;gap:22px;padding:22px}.detail img{width:100%;border-radius:8px}.close{float:right;margin:12px;background:#2a2a2f;color:#fff;border-radius:50%;width:34px;height:34px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#29292e;padding:4px 8px;border-radius:20px;font-size:12px;color:#ddd}
footer{padding:45px 5vw;color:#777;border-top:1px solid var(--line);margin-top:30px}
@media(max-width:700px){.links{display:none}.search input{width:150px}.hero{min-height:440px;padding-top:120px}.detail{grid-template-columns:110px 1fr;gap:14px}.rail{grid-auto-columns:140px}section{padding-left:4vw;padding-right:4vw}}
</style>
</head>
<body>
<nav class="nav"><div class="logo">KAGE</div><div class="links"><button onclick="scrollToId('home')">Home</button><button onclick="scrollToId('browse')">Browse</button><button onclick="showList()">My List</button></div><div class="search"><input id="searchInput" placeholder="Search anime…"><button onclick="searchAnime()">⌕</button></div></nav>
<main id="home">
<div class="hero" id="hero"><div class="hero-copy"><div class="eyebrow">Discover anime</div><h1 id="heroTitle">Loading your next obsession…</h1><p id="heroText">Fetching live anime metadata and artwork from Jikan.</p><div class="actions"><button class="primary" id="heroBtn">View details</button><button class="secondary" onclick="showList()">My List</button></div></div></div>
<section><div class="section-head"><h2>🔥 Trending Now</h2></div><div class="rail" id="trending"></div></section>
<section><div class="section-head"><h2>⭐ Top Anime</h2></div><div class="rail" id="top"></div></section>
<section><div class="section-head"><h2>📺 Currently Airing</h2></div><div class="rail" id="airing"></div></section>
<section><div class="section-head"><h2>🚀 Upcoming</h2></div><div class="rail" id="upcoming"></div></section>
<section id="browse"><div class="section-head"><h2>Browse</h2><div class="filters"><select id="genre"><option value="">All genres</option></select><select id="type"><option value="">All types</option><option>TV</option><option>Movie</option><option>OVA</option><option>ONA</option><option>Special</option></select><select id="sort"><option value="score">Highest rated</option><option value="popularity">Most popular</option></select><button class="primary" onclick="browse()">Apply</button></div></div><div class="rail" id="browseGrid" style="grid-auto-flow:row;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));overflow:visible"></div></section>
</main>
<footer>KAGE · Anime discovery powered by the Jikan API. Artwork and metadata are provided by Jikan/MyAnimeList.</footer>
<div class="modal" id="modal"><div class="dialog"><button class="close" onclick="closeModal()">×</button><div class="detail"><img id="detailImg"><div><div class="eyebrow" id="detailType"></div><h1 id="detailTitle"></h1><div id="detailMeta"></div><div class="chips" id="detailGenres"></div><p id="detailSynopsis"></p><div class="actions"><button class="primary" id="listBtn">＋ My List</button><button class="secondary" id="malBtn">MyAnimeList</button></div><h3>Recommended</h3><div class="rail" id="recommendations"></div></div></div></div></div>
<script>
const API='https://api.jikan.moe/v4'; let cache={}, current=null;
const $=id=>document.getElementById(id); const list=()=>JSON.parse(localStorage.kageList||'[]'); const save=x=>localStorage.kageList=JSON.stringify(x);
async function api(path){if(cache[path])return cache[path];let r=await fetch(API+path);if(!r.ok)throw Error('Jikan request failed');let j=await r.json();cache[path]=j.data;return j.data}
function img(a){return a?.images?.jpg?.large_image_url||a?.images?.jpg?.image_url||''}
function card(a){return `<article class="card" onclick="openAnime(${a.mal_id})"><div class="poster"><img loading="lazy" src="${img(a)}" alt=""><span class="badge">★ ${a.score??'—'}</span></div><div class="card-body"><div class="title">${esc(a.title)}</div><div class="meta">${a.type||'Anime'} · ${a.episodes??'?'} eps · ${a.year||a.aired?.prop?.from?.year||'—'}</div></div></article>`}
function render(id,arr){$(id).innerHTML=arr?.length?arr.map(card).join(''):'<div class="empty">No anime found.</div>'}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function init(){try{let [top,airing,upcoming]=await Promise.all([api('/top/anime?limit=12'),api('/anime?status=airing&order_by=score&sort=desc&limit=12'),api('/seasons/upcoming?limit=12')]);render('trending',top.slice(0,12));render('top',top);render('airing',airing);render('upcoming',upcoming);hero(top[0]);let genres=await api('/genres/anime?filter=genres');$('genre').innerHTML+=[...genres].sort((a,b)=>a.name.localeCompare(b.name)).map(g=>`<option value="${g.mal_id}">${esc(g.name)}</option>`).join('');}catch(e){console.error(e)}}
function hero(a){current=a;$('hero').style.backgroundImage=`url("${img(a)}")`;$('heroTitle').textContent=a.title;$('heroText').textContent=(a.synopsis||'').slice(0,300);$('heroBtn').onclick=()=>openAnime(a.mal_id)}
async function openAnime(id){try{let a=await api('/anime/'+id+'/full');current=a;$('detailImg').src=img(a);$('detailTitle').textContent=a.title;$('detailType').textContent=`${a.type||'Anime'} · ${a.status||''}`;$('detailMeta').innerHTML=`★ <b>${a.score??'—'}</b> · ${a.episodes??'?'} episodes · ${a.year||a.aired?.prop?.from?.year||'—'} · Rank #${a.rank??'—'}`;$('detailSynopsis').textContent=a.synopsis||'No synopsis available.';$('detailGenres').innerHTML=(a.genres||[]).map(g=>`<span class="chip">${esc(g.name)}</span>`).join('');$('malBtn').onclick=()=>window.open(a.url,'_blank');updateListButton();$('modal').classList.add('open');let rec=await api('/anime/'+id+'/recommendations');render('recommendations',(rec||[]).slice(0,8).map(x=>x.entry));}catch(e){alert('Unable to load this anime right now.')}} 
function updateListButton(){let has=list().some(x=>x.mal_id===current.mal_id);$('listBtn').textContent=has?'✓ In My List':'＋ My List';$('listBtn').onclick=()=>{let l=list();l=has?l.filter(x=>x.mal_id!==current.mal_id):[...l,current];save(l);updateListButton()}}
function closeModal(){$('modal').classList.remove('open')}
async function searchAnime(){let q=$('searchInput').value.trim();if(!q)return;scrollToId('browse');$('browseGrid').innerHTML='<div class="empty">Searching Jikan…</div>';try{render('browseGrid',await api('/anime?q='+encodeURIComponent(q)+'&limit=24'))}catch(e){$('browseGrid').innerHTML='<div class="empty">Search failed. Try again.</div>'}}
async function browse(){let g=$('genre').value,t=$('type').value,s=$('sort').value;let p=`/anime?limit=24&order_by=${s==='popularity'?'popularity':'score'}&sort=desc`;if(g)p+=`&genres=${g}`;if(t)p+=`&type=${t}`;render('browseGrid',await api(p))}
function showList(){scrollToId('browse');render('browseGrid',list());}
function scrollToId(id){$(id).scrollIntoView({behavior:'smooth'})}
$('searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')searchAnime()});init();
</script>
</body></html>
