<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08080c"><meta name="description" content="KAGE — premium anime discovery and personal vault."><link rel="manifest" href="manifest.webmanifest"><title>KAGE — Anime</title><style>

position:absolute;inset:auto 0 0;height:45%;background:linear-gradient(transparent,#000b);pointer-events:none}.badge{position:absolute;z-index:2;left:8px;top:8px;background:#09090ddd;border:1px solid #ffffff18;border-radius:5px;padding:5px 7px;font-size:11px;font-weight:800}.rating{position:absolute;z-index:2;right:8px;bottom:8px;color:#ffd28a;font-size:11px;font-weight:800}.info{padding:9px 2px 0}.title{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.small{color:var(--muted);font-size:11px;margin-top:4px}.band{background:linear-gradient(90deg,#111117,#0d0d12);border-block:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:20px 14px}.skeleton{background:linear-gradient(90deg,#ffffff06,#ffffff12,#ffffff06);background-size:200% 100%;animation:sh 1.4s infinite}.skCard{aspect-ratio:2/3;border-radius:7px}.empty{padding:60px 20px;text-align:center;color:var(--muted);border:1px dashed #ffffff17;border-radius:12px;background:#ffffff03}.modalBack{position:fixed;inset:0;z-index:100;background:#000c;backdrop-filter:blur(12px);display:grid;place-items:center;padding:18px}.modal{width:min(940px,100%);max-height:92vh;overflow:auto;background:#121218;border:1px solid #ffffff17;border-radius:14px;box-shadow:var(--shadow);position:relative}.close{position:absolute;right:14px;top:14px;z-index:4;width:36px;height:36px;border:1px solid #ffffff18;border-radius:50%;background:#09090dcc;color:white}.detailHero{min-height:430px;position:relative;background-size:cover;background-position:center}.detailHero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#121218 0,#121218c8 42%,#12121822),linear-gradient(0deg,#121218,transparent 55%)}.detailBody{position:relative;z-index:2;padding:70px 30px 28px;display:grid;grid-template-columns:180px 1fr;gap:24px;align-items:end}.detailPoster{width:180px;aspect-ratio:2/3;object-fit:cover;border-radius:8px;box-shadow:0 20px 50px #000b}.detailCopy h1{font-size:39px;line-height:1;letter-spacing:-1.5px;margin:8px 0 14px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chip{border:1px solid #ffffff16;background:#ffffff08;border-radius:999px;padding:6px 9px;color:#d9d5db;font-size:11px}.auth{width:min(430px,calc(100% - 32px));margin:70px auto;background:#111117;border:1px solid var(--line);border-radius:14px;padding:28px;box-shadow:var(--shadow)}.field{width:100%;margin:7px 0;padding:12px;border:1px solid #ffffff16;border-radius:8px;background:#ffffff07;color:white}.toast{position:fixed;right:18px;bottom:86px;z-index:120;background:#17171f;border:1px solid #ffffff18;border-radius:8px;padding:12px 15px;box-shadow:var(--shadow)}.bottom{display:none}.footer{padding:55px 20px 100px;text-align:center;color:#77737d;font-size:12px}@keyframes sh{to{background-position:-200% 0}}@media(max-width:850px){.links{display:none}.nav{gap:12px}.search{width:auto;flex:1}.hero{min-height:550px}.detailBody{grid-template-columns:120px 1fr;padding:50px 18px 22px}.detailPoster{width:120px}.detailCopy h1{font-size:28px}}@media(max-width:600px){.nav{height:60px}.brand strong{font-size:18px}.account{width:34px;height:34px}.search{display:none}.mobileSearch{display:flex;padding:12px 16px 0}.mobileSearch form{width:100%;display:flex;background:#ffffff08;border:1px solid var(--line);border-radius:8px;overflow:hidden}.mobileSearch input{flex:1;min-width:0;background:transparent;border:0;padding:11px;color:white;outline:0}.mobileSearch button{border:0;background:var(--orange);color:white;padding:0 14px}.hero{min-height:530px;padding:45px 18px 45px;background-position:60% center}.hero:before{background:linear-gradient(90deg,#08080cf7,#08080c88 70%),linear-gradient(0deg,#08080c,transparent 65%)}.hero h1{font-size:43px;letter-spacing:-2px}.section{padding:25px 16px}.rail{grid-auto-columns:145px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:18px 10px}.bottom{display:flex;position:fixed;z-index:80;left:50%;bottom:10px;transform:translateX(-50%);width:min(94vw,430px);justify-content:space-around;padding:8px 5px;background:#111117ee;backdrop-filter:blur(20px);border:1px solid #ffffff17;border-radius:14px;box-shadow:0 12px 35px #000b}.bottom button{background:none;border:0;color:#8f8c95;font-size:10px;padding:5px 10px}.bottom .active{color:white}.detailBody{grid-template-columns:1fr;padding:30px 18px}.detailPoster{width:150px}.detailCopy h1{font-size:30px}.modal{max-height:95vh}.footer{padding-bottom:110px}}
</style></head><body>
<header class="nav"><a class="brand" href="#/"><span class="mark">K</span><strong>KAGE</strong></a><nav class="links"><button data-nav="home" onclick="go('#/')">Home</button><button data-nav="browse" onclick="go('#/search')">Browse</button><button data-nav="genres" onclick="go('#/genres')">Genres</button><button data-nav="calendar" onclick="go('#/calendar')">Schedule</button><button data-nav="vault" onclick="go('#/vault')">My Vault</button></nav><form class="search" id="searchForm"><input id="q" aria-label="Search anime" placeholder="Search anime, genres, characters…"><button>⌕</button></form><button class="account" id="accountBtn" onclick="go('#/account')">K</button></header>
<div class="mobileSearch"><form id="mobileSearchForm"><input id="mq" placeholder="Search anime…" aria-label="Search anime"><button>Search</button></form></div><main id="root"></main><nav class="bottom"><button data-nav="home" onclick="go('#/')">⌂<br>Home</button><button data-nav="browse" onclick="go('#/search')">⌕<br>Browse</button><button data-nav="vault" onclick="go('#/vault')">♡<br>Vault</button><button data-nav="genres" onclick="go('#/genres')">◈<br>Genres</button><button data-nav="account" onclick="go('#/account')">◉<br>More</button></nav><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const J='https://api.jikan.moe/v4',SUPA='https://xqnjizzygeqsrhaqvspu.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhxbmppenp5Z2Vxc3JoYXF2c3B1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTMwNzcwMDMsImV4cCI6MjA2ODY1MzAwM30.gZOCaGmFDLxPtKa4lz6aGNGaAXnYoprjbqr7xGtAckg';const sb=window.supabase?.createClient(SUPA,KEY);const cache=new Map();let user=null;const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const poster=a=>a?.images?.jpg?.large_image_url||a?.images?.jpg?.image_url||'';
async function api(p){if(cache.has(p))return cache.get(p);for(let i=0;i<3;i++){try{const r=await fetch(J+p);if(r.status===429){await new Promise(x=>setTimeout(x,900*(i+1)));continue}if(!r.ok)throw Error();const d=(await r.json()).data||[];cache.set(p,d);return d}catch(e){if(i===2)throw e;await new Promise(x=>setTimeout(x,500*(i+1)))}}}
function toast(t){const x=document.getElementById('toast');x.textContent=t;x.className='toast';setTimeout(()=>x.className='',2800)}function setActive(k){document.querySelectorAll('[data-nav]').forEach(x=>x.classList.toggle('active',x.dataset.nav===k))}function card(a,i){return `<button class="card" onclick="details(${a.mal_id})"><div class="cover"><span class="badge">${i!==undefined?'#'+(i+1):'★ '+(a.score??'—')}</span><img loading="lazy" src="${esc(poster(a))}" alt="${esc(a.title)}"><span class="rating">★ ${a.score??'—'}</span></div><div class="info"><div class="title">${esc(a.title)}</div><div class="small">${esc(a.type||'Anime')} · ${a.episodes??'?'} eps</div></div></button>`}
function rail(name,path,sub){const id='r'+Math.random().toString(36).slice(2);root.insertAdjacentHTML('beforeend',`<section class="section"><div class="sectionTop"><div><h2 class="sectionTitle">${name}</h2><div class="sub">${sub}</div></div><button class="sub" style="border:0;background:none;color:#aaa" onclick="location.reload()">Refresh</button></div><div class="rail" id="${id}">${Array.from({length:7},()=>'<div class="skeleton skCard"></div>').join('')}</div></section>`);api(path).then(d=>{const e=document.getElementById(id);if(e)e.innerHTML=d.map((a,i)=>card(a,i)).join('')||'<div class="empty">No titles available.</div>'}).catch(()=>{const e=document.getElementById(id);if(e)e.innerHTML='<div class="empty">This section is temporarily unavailable. The rest of KAGE is still available.</div>'})}
async function home(){setActive('home');root.innerHTML='<section class="hero" id="hero"><div class="heroInner"><div class="kicker">KAGE · Featured</div><h1>Find your next obsession.</h1><div class="meta"><span>Anime</span><span>Updated daily</span><span>Jikan catalog</span></div><p>Discover trending, airing, popular and upcoming anime in a premium, fast-moving catalog. Sections load independently so one slow request never blocks KAGE.</p><div class="actions"><button class="btn primary" onclick="go(\'#/search\')">Browse anime</button><button class="btn ghost" onclick="go(\'#/vault\')">Open My Vault</button></div></div></section><div id="heroSpace"></div>';const d=await api('/top/anime?limit=6').catch(()=>[]);if(d[0]){hero.style.backgroundImage=`url("${poster(d[0])}")`;hero.querySelector('h1').textContent=d[0].title;hero.querySelector('p').textContent=(d[0].synopsis||'Discover your next favorite anime.').replace(/\n/g,' ').slice(0,330)}await continueRail();rail('Trending Now','/top/anime?limit=12','The titles everyone is watching');rail('Live Simulcast','/anime?status=airing&order_by=score&sort=desc&limit=12','Currently airing');rail('Most Popular','/top/anime?filter=bypopularity&limit=12','Popular across MyAnimeList');rail('All-Time Favorites','/top/anime?filter=favorite&limit=12','Community favorites');rail('Coming Soon','/seasons/upcoming?limit=12','Upcoming seasons')}
async function continueRail(){if(!user)return;const p=localStorage.getItem('kage_profile');if(!p)return;const {data}=await sb.from('kage_continue_watching').select('*').eq('profile_id',p).order('updated_at',{ascending:false}).limit(10);if(!data?.length)return;document.getElementById('heroSpace').innerHTML='<section class="section band"><div class="sectionTop"><div><h2 class="sectionTitle">Continue Watching</h2><div class="sub">Pick up where you left off</div></div></div><div class="rail">'+data.map(x=>`<button class="card"><div class="cover"><img src="${esc(x.poster_url||'')}" alt="${esc(x.title)}"><span class="rating">EP ${x.episode}</span></div><div class="info"><div class="title">${esc(x.title)}</div><div class="small">${Math.round((x.position_seconds/Math.max(1,x.duration_seconds))*100)}% watched</div></div></button>`).join('')+'</div></section>'}
async function details(id){const a=await api('/anime/'+id+'/full').catch(()=>null);if(!a){toast('Details are temporarily unavailable');return}const saved=user&&await isSaved(id);document.body.insertAdjacentHTML('beforeend',`<div class="modalBack" id="modal" onclick="if(event.target===this)modal.remove()"><div class="modal"><button class="close" onclick="modal.remove()">×</button><div class="detailHero" style="background-image:url('${esc(a.images?.jpg?.large_image_url||'')}')"><div class="detailBody"><img class="detailPoster" src="${esc(poster(a))}" alt="${esc(a.title)}"><div class="detailCopy"><div class="kicker">${esc(a.type||'Anime')} · ${esc(a.status||'')}</div><h1>${esc(a.title)}</h1><div class="meta"><span>★ ${a.score??'—'}</span><span>${a.year??'—'}</span><span>${a.episodes??'?'} episodes</span></div><div class="chips">${(a.genres||[]).slice(0,5).map(g=>`<span class="chip">${esc(g.name)}</span>`).join('')}</div></div></div></div><div style="padding:0 30px 30px"><p style="color:#c9c5cc;line-height:1.7">${esc(a.synopsis||'No synopsis available.')}</p><div class="actions"><button class="btn orange" onclick="saveAnime(${a.mal_id},'${esc(a.title).replace(/'/g,"\\'")}','${esc(poster(a))}')">${saved?'Remove from My Vault':'Save to My Vault'}</button>${a.trailer?.url?`<button class="btn ghost" onclick="window.open('${esc(a.trailer.url)}','_blank','noopener')">Watch Trailer</button>`:''}</div></div></div></div>`)}
async function isSaved(id){if(!user)return false;const {data}=await sb.from('kage_saved_anime').select('id').eq('user_id',user.id).eq('mal_id',id).maybeSingle();return !!data}async function saveAnime(id,title,img){if(!user){toast('Sign in to sync My Vault');go('#/account');return}const {data}=await sb.from('kage_saved_anime').select('id').eq('user_id',user.id).eq('mal_id',id).maybeSingle();if(data){await sb.from('kage_saved_anime').delete().eq('id',data.id);toast('Removed from My Vault')}else{await sb.from('kage_saved_anime').insert({user_id:user.id,mal_id:id,title,poster_url:img});toast('Saved to My Vault')}document.getElementById('modal')?.remove()}
async function searchPage(q=''){setActive('browse');root.innerHTML=`<section class="section"><h1 class="sectionTitle" style="font-size:30px">Browse anime</h1><div class="sub" style="margin:5px 0 24px">Search the KAGE catalog</div><form id="bigSearch" style="display:flex;gap:8px;margin-bottom:24px"><input class="field" style="margin:0" id="bq" value="${esc(q)}" placeholder="Search titles…"><button class="btn orange">Search</button></form><div id="results" class="grid">${Array.from({length:12},()=>'<div class="skeleton skCard"></div>').join('')}</div></section>`;if(!q){results.innerHTML='<div class="empty" style="grid-column:1/-1">Search for an anime to begin.</div>';return}try{const d=await api('/anime?q='+encodeURIComponent(q)+'&limit=24');results.innerHTML=d.length?d.map((a,i)=>card(a,i)).join(''):'<div class="empty" style="grid-column:1/-1">No anime matched that search.</div>'}catch(e){results.innerHTML='<div class="empty" style="grid-column:1/-1">Search is temporarily unavailable. Try again.</div>'}bigSearch.onsubmit=e=>{e.preventDefault();searchPage(bq.value.trim())}}
async function genres(){setActive('genres');root.innerHTML='<section class="section"><h1 class="sectionTitle" style="font-size:30px">Genres</h1><div class="sub" style="margin:5px 0 24px">Explore by mood, story and style</div><div id="genreGrid" class="grid"></div></section>';try{const d=await api('/genres/anime');genreGrid.innerHTML=d.map(g=>`<button class="glass" style="text-align:left;color:white;border:1px solid #ffffff12" onclick="genre(${g.mal_id},'${esc(g.name).replace(/'/g,"\\'")}')"><strong>${esc(g.name)}</strong><div class="sub">Explore titles</div></button>`).join('')}catch(e){genreGrid.innerHTML='<div class="empty">Genres are temporarily unavailable.</div>'}}
async function genre(id,name){root.innerHTML=`<section class="section"><button class="sub" style="border:0;background:none;color:#aaa" onclick="genres()">← All genres</button><h1 class="sectionTitle" style="font-size:32px;margin-top:15px">${esc(name)}</h1><div id="results" class="grid" style="margin-top:24px">${Array.from({length:12},()=>'<div class="skeleton skCard"></div>').join('')}</div></section>`;try{const d=await api('/anime?genres='+id+'&limit=24&order_by=score&sort=desc');results.innerHTML=d.map((a,i)=>card(a,i)).join('')||'<div class="empty">No titles found.</div>'}catch(e){results.innerHTML='<div class="empty">Unable to load this genre.</div>'}}
async function calendar(){setActive('calendar');root.innerHTML='<section class="section"><h1 class="sectionTitle" style="font-size:30px">Weekly schedule</h1><div class="sub" style="margin:5px 0 24px">What is airing now</div><div id="cal" class="grid"></div></section>';try{const d=await api('/schedules?limit=24');cal.innerHTML=d.map(a=>card(a)).join('')||'<div class="empty">No schedule data right now.</div>'}catch(e){cal.innerHTML='<div class="empty">Schedule data is temporarily unavailable.</div>'}}
async function vault(){setActive('vault');if(!user){root.innerHTML='<div class="auth"><div class="kicker">My Vault</div><h1>Keep your anime close.</h1><p class="sub">Sign in to sync saved anime and Continue Watching across devices.</p><button class="btn orange" onclick="go(\'#/account\')">Sign in</button></div>';return}const {data}=await sb.from('kage_saved_anime').select('*').eq('user_id',user.id).order('created_at',{ascending:false});root.innerHTML=`<section class="section"><h1 class="sectionTitle" style="font-size:30px">My Vault</h1><div class="sub" style="margin:5px 0 24px">Your saved anime</div><div class="grid">${data?.length?data.map((a,i)=>card({mal_id:a.mal_id,title:a.title,images:{jpg:{large_image_url:a.poster_url}}},i)).join(''):'<div class="empty" style="grid-column:1/-1">Your Vault is empty. Save anime from any title page.</div>'}</div></section>`}
async function account(){setActive('account');root.innerHTML=`<div class="auth"><div class="kicker">KAGE Account</div><h1>${user?'Welcome back.':'Your KAGE account.'}</h1><p class="sub">${user?esc(user.email):'Sync your Vault and Continue Watching across devices.'}</p>${user?'<button class="btn ghost" id="signout">Sign out</button>':'<input class="field" id="email" placeholder="Email"><input class="field" id="password" type="password" placeholder="Password"><div class="actions"><button class="btn orange" id="signin">Sign in</button><button class="btn ghost" id="signup">Create account</button></div>'}</div>`;if(user)signout.onclick=async()=>{await sb.auth.signOut();location.reload()};else{signin.onclick=async()=>{const {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});if(error)toast(error.message);else location.hash='#/'};signup.onclick=async()=>{const {error}=await sb.auth.signUp({email:email.value,password:password.value});if(error)toast(error.message);else toast('Check your email to confirm your account')}}}
function go(h){location.hash=h;route()}function route(){const h=location.hash||'#/';const [p,q]=h.slice(2).split('?');if(p==='search')searchPage(q?decodeURIComponent(q):'');else if(p==='genres')genres();else if(p==='calendar')calendar();else if(p==='vault')vault();else if(p==='account')account();else home()}
searchForm.onsubmit=e=>{e.preventDefault();const qv=q.value.trim();location.hash='#/search?'+encodeURIComponent(qv);searchPage(qv)};mobileSearchForm.onsubmit=e=>{e.preventDefault();const qv=mq.value.trim();location.hash='#/search?'+encodeURIComponent(qv);searchPage(qv)};(async()=>{if(sb){const s=await sb.auth.getSession();user=s.data.session?.user||null;sb.auth.onAuthStateChange((_e,session)=>{user=session?.user||null;accountBtn.textContent=user?(user.email?.[0]||'K').toUpperCase():'K'})}route()})();window.addEventListener('hashchange',route);
</script><footer class="footer">KAGE · Anime discovery powered by Jikan. Posters and metadata are provided for discovery.</footer></body></html>
