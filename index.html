<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f0a14"><meta name="description" content="KAGE — anime discovery, watch progress and personal vault.">
<link rel="manifest" href="manifest.webmanifest"><title>KAGE — Anime</title>
<style>
:root{--bg:#0f0a14;--panel:#1b1222;--panel2:#24172d;--text:#fff8f2;--muted:#b7a9bd;--accent:#ff7a2d;--amber:#ffd29a;--line:#ffffff14;--danger:#ff6b6b}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(circle at 90% 0,#3b1c2b66,transparent 34%),radial-gradient(circle at 0 100%,#6b3a1640,transparent 30%),var(--bg);color:var(--text);font:15px Inter,system-ui,sans-serif;min-height:100vh}button,input{font:inherit}.nav{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:20px;padding:13px max(18px,4vw);background:#0f0a14df;backdrop-filter:blur(22px);border-bottom:1px solid var(--line)}.logo{font-size:27px;font-weight:950;letter-spacing:-1px;color:var(--accent);cursor:pointer}.links{display:flex;gap:18px}.links button,.ghost{background:none;border:0;color:#e9dfea;cursor:pointer}.links button:hover,.ghost:hover{color:var(--amber)}.search{margin-left:auto;display:flex;max-width:370px;flex:1;background:#ffffff0c;border:1px solid var(--line);border-radius:999px;overflow:hidden}.search input{width:100%;background:none;border:0;outline:0;color:white;padding:11px 15px}.search button{background:var(--accent);border:0;padding:0 17px;font-weight:900;cursor:pointer}.hero{min-height:560px;padding:80px max(22px,6vw) 65px;display:flex;align-items:end;position:relative;background-size:cover;background-position:center}.hero:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,#0f0a14 0,#0f0a14e8 34%,#0f0a1440 78%),linear-gradient(0deg,#0f0a14,transparent 58%)}.copy{position:relative;z-index:1;max-width:720px}.eyebrow{color:var(--accent);font-weight:900;letter-spacing:2px;text-transform:uppercase}.hero h1{font-size:clamp(42px,7vw,82px);line-height:.95;margin:10px 0}.hero p{color:#e0d5e2;line-height:1.6;max-width:650px}.actions{display:flex;gap:10px;flex-wrap:wrap}.primary,.secondary{border:0;border-radius:10px;padding:11px 17px;font-weight:850;cursor:pointer}.primary{background:linear-gradient(135deg,var(--accent),var(--amber));color:#21100a}.secondary{background:#ffffff10;border:1px solid var(--line);color:white}.section{padding:28px max(18px,4vw)}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head h2{margin:0;font-size:22px}.muted{color:var(--muted)}.rail{display:grid;grid-auto-flow:column;grid-auto-columns:174px;gap:15px;overflow-x:auto;padding:2px 2px 12px;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:15px}.card{display:block;text-align:left;background:#ffffff08;border:1px solid var(--line);border-radius:12px;overflow:hidden;color:white;cursor:pointer;padding:0;transition:.2s transform,.2s border-color}.card:hover{transform:translateY(-4px);border-color:#ff7a2d66}.poster{aspect-ratio:2/3;background:#241b29;position:relative}.poster img{width:100%;height:100%;object-fit:cover;display:block}.score{position:absolute;top:8px;left:8px;background:#09060ccc;padding:5px 7px;border-radius:7px;font-size:11px;z-index:1}.body{padding:10px}.title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{font-size:12px;color:var(--muted);margin-top:4px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:6px 9px;border:1px solid var(--line);background:#ffffff08;border-radius:999px;color:#ddd}.glass{background:#ffffff08;border:1px solid var(--line);border-radius:14px;padding:18px}.empty{text-align:center;padding:34px;color:var(--muted)}.error{padding:15px;border:1px solid #ff6b6b33;background:#ff6b6b0b;border-radius:12px;color:#e7dce8}.modalBack{position:fixed;inset:0;z-index:50;background:#050308cc;backdrop-filter:blur(10px);display:grid;place-items:center;padding:18px}.modal{width:min(900px,100%);max-height:90vh;overflow:auto;background:#17101d;border:1px solid var(--line);border-radius:18px;padding:20px;position:relative}.close{position:absolute;right:14px;top:12px;border:0;background:#ffffff10;color:white;border-radius:50%;width:36px;height:36px;cursor:pointer}.detail{display:grid;grid-template-columns:220px 1fr;gap:24px}.detail img{width:100%;border-radius:12px}.auth{width:min(430px,100%);margin:70px auto}.auth input{width:100%;margin:7px 0;padding:12px;border-radius:10px;border:1px solid var(--line);background:#ffffff08;color:white}.toast{position:fixed;right:18px;bottom:85px;z-index:60;background:#201526;border:1px solid var(--line);padding:12px 15px;border-radius:10px;box-shadow:0 12px 40px #0008}.bottom{display:none}.loading{height:250px;border-radius:12px;background:linear-gradient(90deg,#ffffff06,#ffffff12,#ffffff06);background-size:200% 100%;animation:sh 1.3s infinite}.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#ff7a2d22;color:var(--amber)}@keyframes sh{to{background-position:-200% 0}}@media(max-width:700px){.links{display:none}.search{max-width:none}.hero{min-height:500px}.detail{grid-template-columns:110px 1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.rail{grid-auto-columns:145px}.bottom{position:fixed;display:flex;z-index:30;bottom:12px;left:50%;transform:translateX(-50%);width:min(94vw,460px);justify-content:space-around;padding:9px;background:#1b1222ee;backdrop-filter:blur(22px);border:1px solid var(--line);border-radius:999px}.bottom button{background:none;border:0;color:#ddd;font-size:12px}.bottom .active{color:var(--amber)}}
</style>
</head>
<body>
<nav class="nav"><b class="logo" onclick="go('#/')">KAGE</b><div class="links"><button onclick="go('#/')">Home</button><button onclick="go('#/search')">Search</button><button onclick="go('#/genres')">Genres</button><button onclick="go('#/calendar')">Schedule</button><button onclick="go('#/vault')">My Vault</button></div><form class="search" id="searchForm"><input id="q" aria-label="Search anime" placeholder="Search anime…"><button>⌕</button></form><button class="ghost" id="accountBtn" onclick="go('#/account')">Sign in</button></nav>
<main id="root"></main><nav class="bottom"><button onclick="go('#/')">⌂<br>Home</button><button onclick="go('#/search')">⌕<br>Search</button><button onclick="go('#/vault')">♡<br>Vault</button><button onclick="go('#/genres')">◈<br>Genres</button><button onclick="go('#/account')">◉<br>More</button></nav>
<div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const J='https://api.jikan.moe/v4',SUPA='https://xqnjizzygeqsrhaqvspu.supabase.co',KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inhxbmppenp5Z2Vxc3JoYXF2c3B1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTMwNzcwMDMsImV4cCI6MjA2ODY1MzAwM30.gZOCaGmFDLxPtKa4lz6aGNGaAXnYoprjbqr7xGtAckg';
const sb=window.supabase?.createClient(SUPA,KEY);const mem=new Map();let user=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const poster=a=>a?.images?.jpg?.large_image_url||a?.images?.jpg?.image_url||'';
async function api(p){let h=mem.get(p);if(h)return h;for(let i=0;i<3;i++){try{let r=await fetch(J+p);if(r.status===429){await new Promise(x=>setTimeout(x,900*(i+1)));continue}if(!r.ok)throw Error();let d=(await r.json()).data;mem.set(p,d);return d}catch(e){if(i===2)throw e;await new Promise(x=>setTimeout(x,500*(i+1)))}}}
function card(a){return `<button class="card" onclick="details(${a.mal_id})"><div class="poster"><span class="score">★ ${a.score??'—'}</span><img loading="lazy" src="${esc(poster(a))}" alt="${esc(a.title)}"></div><div class="body"><div class="title">${esc(a.title)}</div><div class="meta">${esc(a.type||'Anime')} · ${a.episodes??'?'} eps</div></div></button>`}
function section(name,path){let id='s'+Math.random().toString(36).slice(2);document.querySelector('#root').insertAdjacentHTML('beforeend',`<section class="section" id="${id}"><div class="head"><h2>${name}</h2><span class="muted">Loading…</span></div><div class="rail"><div class="loading"></div><div class="loading"></div><div class="loading"></div></div></section>`);api(path).then(d=>{let el=document.getElementById(id);if(el){el.querySelector('.muted').textContent='Live catalog';el.querySelector('.rail').innerHTML=d.map(card).join('')}}).catch(()=>{let el=document.getElementById(id);if(el)el.querySelector('.rail').innerHTML='<div class="error">This section is temporarily unavailable. Tap reload or try again shortly.</div>'})}
async function home(){root.innerHTML='<section class="hero" id="hero"><div class="copy"><div class="eyebrow">KAGE</div><h1>Anime, without the clutter.</h1><p>Discover trending, seasonal and airing anime with posters from Jikan. Sections load independently so one slow request never blocks the whole page.</p><div class="actions"><button class="primary" onclick="go(\'#/search\')">Explore anime</button><button class="secondary" onclick="go(\'#/vault\')">My Vault</button></div></div></section><div id="continue"></div><div id="sections"></div>';let d=await api('/top/anime?limit=8').catch(()=>[]);if(d[0]){hero.style.backgroundImage=`url("${poster(d[0])}")`;hero.querySelector('h1').textContent=d[0].title;hero.querySelector('p').textContent=(d[0].synopsis||'Discover your next favorite anime.').slice(0,340)}[['Trending Now','/top/anime?limit=12'],['Live Simulcast','/anime?status=airing&order_by=score&sort=desc&limit=12'],['Most Popular','/top/anime?filter=bypopularity&limit=12'],['Top Favorites','/top/anime?filter=favorite&limit=12'],['Upcoming','/seasons/upcoming?limit=12']].forEach(x=>{let old=root;document.querySelector('#sections').insertAdjacentHTML('beforeend','');section(x[0],x[1])});loadContinue()}
async function loadContinue(){if(!user)return;let p=localStorage.getItem('kage_profile');if(!p)return;let {data}=await sb.from('kage_continue_watching').select('*').eq('profile_id',p).order('updated_at',{ascending:false}).limit(12);if(!data?.length)return;document.querySelector('#continue').innerHTML='<section class="section"><div class="head"><h2>Continue Watching</h2><span class="muted">Synced with KAGE</span></div><div class="rail">'+data.map(x=>`<div class="card"><div class="poster"><img loading="lazy" src="${esc(x.poster_url||'')}" alt="${esc(x.title)}"><span class="score">EP ${x.episode}</span></div><div class="body"><div class="title">${esc(x.title)}</div><div class="meta">${Math.round((x.position_seconds/Math.max(1,x.duration_seconds))*100)}% watched</div></div></div>`).join('')+'</div></section>'}
async function details(id){let a=await api('/anime/'+id+'/full').catch(()=>null);if(!a){toast('Details unavailable right now');return}let saved=user?await isSaved(id):false;document.body.insertAdjacentHTML('beforeend',`<div class="modalBack" id="modal" onclick="if(event.target===this)this.remove()"><div class="modal"><button class="close" onclick="modal.remove()">×</button><div class="detail"><img src="${esc(poster(a))}" alt="${esc(a.title)}"><div><div class="eyebrow">${esc(a.type||'Anime')} · ${esc(a.status||'')}</div><h1>${esc(a.title)}</h1><div class="chips"><span class="badge">★ ${a.score??'—'}</span><span class="badge">${a.episodes??'?'} episodes</span><span class="badge">${a.year??'—'}</span></div><p class="muted">${esc(a.synopsis||'No synopsis available.')}</p><div class="chips">${(a.genres||[]).map(g=>`<span class="chip">${esc(g.name)}</span>`).join('')}</div><div class="actions" style="margin-top:18px"><button class="primary" onclick="saveAnime(${a.mal_id},'${esc(a.title).replace(/'/g,"\\'")}','${esc(poster(a))}');this.textContent='Saved ✓'">${saved?'Saved ✓':'Save to Vault'}</button>${a.trailer?.url?`<button class="secondary" onclick="window.open('${esc(a.trailer.url)}','_blank')">Trailer</button>`:''}</div></div></div></div></div>`)}
async function isSaved(id){if(!user)return false;let {data}=await sb.from('kage_saved_anime').select('id').eq('user_id',user.id).eq('mal_id',id).maybeSingle();return !!data}
async function saveAnime(id,title,img){if(!user){toast('Sign in to sync your Vault');go('#/account');return}let {data}=await sb.from('kage_saved_anime').select('id').eq('user_id',user.id).eq('mal_id',id).maybeSingle();if(data){await sb.from('kage_saved_anime').delete().eq('id',data.id);toast('Removed from Vault')}else{await sb.from('kage_saved_anime').insert({user_id:user.id,mal_id:id,title,poster_url:img});toast('Saved to Vault')}}
async function search(){let q=document.getElementById('q').value.trim();if(!q)return;go('#/search?'+encodeURIComponent(q))}
async function searchPage(q){root.innerHTML=`<section class="section"><div class="head"><h1>Search</h1><span class="muted">${esc(q||'')}</span></div><div id="searchResults" class="grid"><div class="loading"></div><div class="loading"></div></div></section>`;if(!q){root.querySelector('.section').insertAdjacentHTML('beforeend','<div class="empty">Search for an anime above.</div>');return}let d=await api('/anime?q='+encodeURIComponent(q)+'&limit=24').catch(()=>[]);searchResults.innerHTML=d.length?d.map(card).join(''):'<div class="empty">No matching anime found.</div>'}
async function vault(){if(!user){root.innerHTML='<section class="section"><div class="glass auth"><div class="eyebrow">KAGE ACCOUNT</div><h1>Your Vault</h1><p class="muted">Sign in to sync saved anime and Continue Watching across devices.</p><button class="primary" onclick="go(\'#/account\')">Sign in</button></div></section>';return}let {data}=await sb.from('kage_saved_anime').select('*').eq('user_id',user.id).order('created_at',{ascending:false});root.innerHTML=`<section class="section"><div class="head"><h1>My Vault</h1><span class="muted">${data?.length||0} saved</span></div><div class="grid">${data?.length?data.map(x=>`<button class="card" onclick="details(${x.mal_id})"><div class="poster"><img loading="lazy" src="${esc(x.poster_url)}" alt="${esc(x.title)}"></div><div class="body"><div class="title">${esc(x.title)}</div><div class="meta">Saved ${new Date(x.created_at).toLocaleDateString()}</div></div></button>`).join(''):'<div class="empty">Your Vault is empty. Save anime from any detail page.</div>'}</div></section>`}
async function genres(){let d=await api('/genres/anime').catch(()=>[]);root.innerHTML='<section class="section"><div class="head"><h1>Genres</h1><span class="muted">Anime categories</span></div><div class="grid">'+d.map(g=>`<button class="glass" onclick="genre(${g.mal_id},'${esc(g.name).replace(/'/g,"\\'")}')"><b>${esc(g.name)}</b><div class="muted">${g.count?.toLocaleString()||0} titles</div></button>`).join('')+'</div></section>'}
async function genre(id,name){let d=await api('/anime?genres='+id+'&order_by=score&sort=desc&limit=24').catch(()=>[]);root.innerHTML=`<section class="section"><div class="head"><h1>${esc(name)}</h1><span class="muted">Genre</span></div><div class="grid">${d.map(card).join('')||'<div class="empty">No titles found.</div>'}</div></section>`}
async function calendar(){let d=await api('/schedules?limit=42').catch(()=>[]),days={};d.forEach(a=>{let k=a.broadcast?.day||'Other';(days[k]??=[]).push(a)});root.innerHTML='<section class="section"><div class="head"><h1>Schedule</h1><span class="muted">Weekly broadcast calendar</span></div>'+Object.entries(days).map(([day,v])=>`<div class="glass" style="margin:12px 0"><h2>${esc(day)}</h2><div class="grid">${v.slice(0,12).map(a=>card(a)).join('')}</div></div>`).join('')+'</section>'}
async function account(){root.innerHTML='<section class="section"><div class="glass auth"><div class="eyebrow">KAGE</div><h1>'+ (user?'Account':'Welcome back') +'</h1>'+ (user?`<p>${esc(user.email)}</p><button class="secondary" onclick="signout()">Sign out</button>`:`<input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><div class="actions"><button class="primary" onclick="signin()">Sign in</button><button class="secondary" onclick="signup()">Create account</button></div><p class="muted">Email authentication is powered by Supabase.</p>`)+'</div></section>'}
async function signin(){let {error}=await sb.auth.signInWithPassword({email:email.value,password:password.value});toast(error?.message||'Signed in');if(!error)go('#/vault')}
async function signup(){let {error}=await sb.auth.signUp({email:email.value,password:password.value});toast(error?.message||'Account created. Check your email if confirmation is enabled.')}
async function signout(){await sb.auth.signOut();user=null;localStorage.removeItem('kage_profile');toast('Signed out');go('#/')}
function toast(x){toastEl=document.getElementById('toast');toastEl.innerHTML='<div class="toast">'+esc(x)+'</div>';setTimeout(()=>toastEl.innerHTML='',3000)}
function go(hash){location.hash=hash}
async function render(){let [path,qstr]=location.hash.slice(1).split('?'),q=qstr?decodeURIComponent(qstr):'';if(path==='/search'){await searchPage(q);return}if(path==='/vault'){await vault();return}if(path==='/genres'){await genres();return}if(path==='/calendar'){await calendar();return}if(path==='/account'){await account();return}home()}
document.getElementById('searchForm').onsubmit=e=>{e.preventDefault();search()};window.addEventListener('hashchange',render);sb?.auth.getSession().then(({data})=>{user=data.session?.user||null;document.getElementById('accountBtn').textContent=user?'Account':'Sign in';render()});sb?.auth.onAuthStateChange((_e,s)=>{user=s?.user||null;document.getElementById('accountBtn').textContent=user?'Account':'Sign in'});
render();
</script></body></html>
